android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# This machine is memory constrained (the OS killed a background process for it). By default Gradle
# forks a separate JVM for the Kotlin compiler, and that second JVM is what gets OOM-killed, which
# surfaces as "Daemon compilation failed: null" with no compiler diagnostic. in-process runs the
# compiler inside the Gradle daemon, so there is one JVM instead of two.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=false
org.gradle.caching=true
